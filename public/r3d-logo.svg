<svg viewBox="0 0 320 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="r3d-chrome-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="r3d-chrome-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="65%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="r3d-cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="30%" stop-color="#22D3EE" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="r3d-cyan-electric" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="r3d-cyan-3d" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="25%" stop-color="#22D3EE" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="90%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>
    <filter id="neon-cyan-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- CROWN -->
  <g transform="translate(105, 12)">
    <path d="M 8 36 Q 55 42 102 36 L 98 43 Q 55 48 12 43 Z" fill="url(#r3d-chrome-light)" stroke="#64748B" stroke-width="0.8" />
    <path d="M 12 40 Q 55 45 98 40" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 10 37 L 16 16 L 36 28 L 55 4 L 74 28 L 94 16 L 100 37 Q 55 42 10 37 Z" fill="url(#r3d-chrome-bevel)" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="16" cy="14" r="3.2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
    <circle cx="36" cy="26" r="2.8" fill="#22D3EE" stroke="#FFFFFF" stroke-width="0.8" />
    <circle cx="55" cy="3" r="4.2" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1" />
    <circle cx="74" cy="26" r="2.8" fill="#22D3EE" stroke="#FFFFFF" stroke-width="0.8" />
    <circle cx="94" cy="14" r="3.2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
  </g>

  <!-- HEXAGON SHIELD -->
  <polygon points="160,54 236,98 236,186 160,230 84,186 84,98" fill="none" stroke="#00F0FF" stroke-width="6" opacity="0.35" filter="url(#neon-cyan-blur)" />
  <polygon points="160,56 234,99 234,184 160,227 86,184 86,99" fill="#070C12" stroke="url(#r3d-chrome-light)" stroke-width="6.5" stroke-linejoin="round" />
  <polygon points="160,67 225,104 225,178 160,215 95,178 95,104" fill="none" stroke="url(#r3d-cyan-electric)" stroke-width="3.5" stroke-linejoin="round" opacity="0.95" />
  <polygon points="160,73 220,108 220,174 160,209 100,174 100,108" fill="#05090E" />

  <!-- EMBLEM INTERIOR -->
  <g>
    <path d="M 103 148 L 103 176 L 158 208 L 160 200 L 115 172 L 115 148 Z" fill="url(#r3d-cyan-glow)" opacity="0.9" filter="url(#neon-cyan-blur)" />
    <path d="M 152 142 L 110 186 L 140 186 L 118 208 L 176 156 L 146 156 Z" fill="url(#r3d-cyan-glow)" stroke="#00F0FF" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 124 100 L 198 100 Q 218 100 218 122 Q 218 144 196 144 L 140 144 L 124 100 Z" fill="url(#r3d-chrome-light)" stroke="#64748B" stroke-width="1.2" />
    <path d="M 148 113 L 190 113 Q 202 113 202 122 Q 202 131 190 131 L 148 131 Z" fill="#05090E" stroke="url(#r3d-cyan-glow)" stroke-width="1" />
    <path d="M 124 100 L 152 144 L 144 144 L 126 128 L 116 142 L 148 142 L 188 184 L 216 184 L 168 136 Q 192 134 204 122 L 124 100 Z" fill="url(#r3d-chrome-bevel)" stroke="#CBD5E1" stroke-width="1" />
    <polygon points="148,142 208,185 190,185 136,142" fill="url(#r3d-chrome-light)" stroke="#FFFFFF" stroke-width="0.8" />
    <path d="M 146 142 L 196 182" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY: R3D -->
  <g transform="translate(18, 240)">
    <ellipse cx="142" cy="72" rx="100" ry="8" fill="#06B6D4" opacity="0.3" filter="url(#neon-cyan-blur)" />
    <!-- Letter R -->
    <g transform="translate(12, 0)">
      <path d="M 8 58 L 8 16 L 36 16 Q 58 16 58 32 Q 58 42 48 48 L 60 58 L 46 58 L 36 48 L 22 48 L 22 58 Z" fill="url(#r3d-chrome-light)" stroke="#64748B" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M 22 28 L 34 28 Q 44 28 44 34 Q 44 40 34 40 L 22 40 Z" fill="#05090E" stroke="#94A3B8" stroke-width="0.8" />
      <path d="M 8 16 L 36 16 Q 56 16 56 30" stroke="#FFFFFF" stroke-width="2" fill="none" />
    </g>
    <!-- Number 3 -->
    <g transform="translate(98, 0)">
      <path d="M 8 16 L 50 16 L 32 34 Q 48 35 52 45 Q 56 55 42 58 Q 28 60 12 56 L 16 45 Q 26 48 36 48 Q 42 48 40 42 Q 38 37 30 37 L 22 37 L 34 26 L 10 26 Z" fill="url(#r3d-cyan-3d)" stroke="#A5F3FC" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M 12 18 L 48 18 L 33 33" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>
    <!-- Letter D -->
    <g transform="translate(182, 0)">
      <path d="M 8 58 L 8 16 L 32 16 Q 58 16 58 37 Q 58 58 32 58 Z" fill="url(#r3d-chrome-light)" stroke="#64748B" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M 22 28 L 30 28 Q 44 28 44 37 Q 44 46 30 46 L 22 46 Z" fill="#05090E" stroke="#94A3B8" stroke-width="0.8" />
      <path d="M 8 16 L 32 16 Q 56 16 56 35" stroke="#FFFFFF" stroke-width="2" fill="none" />
    </g>
  </g>
</svg>
